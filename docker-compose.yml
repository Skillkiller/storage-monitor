services:
  openssh-pass:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: openssh-pass
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - PASSWORD_ACCESS=true
      - USER_PASSWORD=password
      - USER_NAME=dev
    volumes:
      - ./docker-mount/ssh-config:/config
    ports:
      - "2222:2222"
    restart: no
